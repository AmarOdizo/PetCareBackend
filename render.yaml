services:
  - type: web
    name: gemini-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        value: 'https://your-frontend-url-from-vercel.vercel.app' # Needs to be updated
